name: Release
on:
  push:
    tags: ['*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Lets anyone verify main.js was built from this repository: gh attestation verify main.js -R onchito-walks/tracing-paper
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
      - run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "Tracing Paper $GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" main.js manifest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
